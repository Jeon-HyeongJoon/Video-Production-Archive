name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/evidence/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-visual.txt

      - name: Install archive workspace golden browser
        run: |
          python -m pip install -r requirements-visual.txt
          python -m playwright install chromium

      - name: Download modules
        run: go mod download

      - name: Prepare media tools for the operational tests
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version > "$EVIDENCE_DIR/ffmpeg-version.txt"
          ffprobe -version > "$EVIDENCE_DIR/ffprobe-version.txt"

      - name: Run all tests and normalize evidence
        id: tests
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          set +e
          go test -json -count=1 ./... > "$EVIDENCE_DIR/go-test.jsonl"
          test_status=$?
          set -e
          go run ./cmd/testevidence \
            -input "$EVIDENCE_DIR/go-test.jsonl" \
            -output "$EVIDENCE_DIR" \
            -run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            -revision "${{ github.sha }}" \
            -repository "${{ github.repository }}"
          exit "$test_status"

      - name: Check operational requirements against the same test run
        if: always()
        run: go run ./cmd/testevidence -operational -input "$EVIDENCE_DIR/go-test.jsonl"

      - name: Check requirement traceability
        if: always()
        shell: bash
        run: go run ./cmd/reqcheck 2>&1 | tee "$EVIDENCE_DIR/requirements.log"

      - name: Check ontology
        if: always()
        shell: bash
        run: go run ./cmd/ontocheck 2>&1 | tee "$EVIDENCE_DIR/ontology.log"

      - name: Run go vet
        if: always()
        shell: bash
        run: go vet ./... 2>&1 | tee "$EVIDENCE_DIR/vet.log"

      - name: Build Linux packages
        if: always()
        shell: bash
        run: go build ./... 2>&1 | tee "$EVIDENCE_DIR/build-linux.log"

      - name: Cross-build Windows amd64 packages
        if: always()
        shell: bash
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./... 2>&1 | tee "$EVIDENCE_DIR/build-windows-amd64.log"

      - name: Verify Windows release executables
        shell: bash
        run: |
          CGO_ENABLED=0 make build-windows
          pwsh -NoProfile -NonInteractive -File deploy/windows/run-integration.ps1 -CheckOnly -BinaryDirectory bin/windows-amd64

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

schema_version: 1

database:
  path: data/control.db

server:
  listen_address: 127.0.0.1:8080
  allowed_cidrs:
    - 127.0.0.0/8
  allowed_origins:
    - http://127.0.0.1:8080
  trusted_proxies: []

security:
  auth_mode: disabled
  mcp_listen_address: 127.0.0.1:8081

features:
  allow_device_format: false
  allow_original_delete: false
  allow_archive_replace: false

provider_accounts:
  - id: provider-primary
    provider: openai
    enabled: false
    secret_ref: wincred://archive/providers/provider-primary

workers:
  heartbeat_ttl: 30s
  definitions:
    - id: worker-main
      enabled: true
      credential_ref: wincred://archive/workers/worker-main
      processing_kinds:
        - INSPECT
        - RENDER
        - AUDIO_EXTRACT
        - STT
        - QC
        - CHECKSUM
        - DEVICE
      allowed_storage_ids:
        - scratch-main
        - archive-primary

storage:
  - id: scratch-main
    role: SCRATCH
    physical_device_id: internal-nvme-01
    partition_id: internal-nvme-01-p1
    volume_id: scratch-main
    root: D:/Archive/scratch
  - id: archive-primary
    role: ARCHIVE_PRIMARY
    physical_device_id: archive-hdd-01
    partition_id: archive-hdd-01-p1
    volume_id: archive-primary
    root: E:/Archive/archive
